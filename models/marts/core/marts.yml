version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_sk
        tests: [not_null, unique]
      - name: customer_key
        tests:
          - not_null
          - unique
  - name: fct_sales
    columns:
      - name: order_key
        tests: [not_null, unique]
      - name: customer_sk
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_sk