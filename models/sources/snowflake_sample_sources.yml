version: 2

sources:
  - name: tpch
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: CUSTOMER
      - name: ORDERS
      - name: LINEITEM
      - name: NATION
      - name: REGION
      - name: PART
      - name: SUPPLIER
  
  - name: demo_db
    database: DEMO_DB
    schema: DEMO_SCHEMA
    tables:
      - name: ORDERS
        freshness:
          warn_after: {count: 3, period: hour}
          error_after: {count: 6, period: hour} 
        loaded_at_field: _INGESTED_AT
        description: "This is the orders table with an ingest timestamp"
      - name: CUSTOMER
        description: "This is the customers table with an ingest timestamp"
      - name: LINEITEM
        description: "This is the lineitem table with an ingest timestamp"
